<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>AnonLink — No-Number Chat & P2P Calls</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --panel-2:#0b1120; --border:#334155; --text:#f8fafc; --muted:#94a3b8; --accent:#6366f1; --accent-hover:#4f46e5; --green:#10b981; --red:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    html, body { width:100%; height:100%; }
    body { background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    @supports (height: 100dvh) { body { height:100dvh; } }
    #lobby { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:20px; padding-top:max(20px,env(safe-area-inset-top)); padding-bottom:max(20px,env(safe-area-inset-bottom)); overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:32px; width:100%; max-width:420px; box-shadow:0 20px 40px rgba(0,0,0,.4); }
    .badge { display:inline-block; background:rgba(99,102,241,.15); color:#a5b4fc; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600; margin-bottom:12px; }
    h1 { font-size:26px; margin-bottom:8px; } .subtitle { color:var(--muted); font-size:14px; margin-bottom:24px; line-height:1.5; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500; }
    input { appearance:none; -webkit-appearance:none; width:100%; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-size:16px; margin-bottom:16px; outline:none; }
    input:focus { border-color:var(--accent); }
    button { -webkit-appearance:none; appearance:none; cursor:pointer; touch-action:manipulation; border:none; border-radius:10px; font-weight:600; font-size:16px; min-height:44px; padding:11px 16px; transition:background-color .15s,border-color .15s; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
    button:disabled { opacity:.55; cursor:default; }
    .btn-primary { background:var(--accent); color:white; width:100%; } .btn-primary:hover { background:var(--accent-hover); }
    .btn-secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--border); } .btn-secondary:hover { border-color:var(--muted); }
    .btn-green { background:var(--green); color:#052e16; } .btn-red { background:var(--red); color:white; }
    .divider { text-align:center; color:var(--muted); font-size:12px; margin:16px 0; } .join-row { display:flex; gap:8px; } .join-row input { margin-bottom:0; text-transform:uppercase; }
    #room { display:none; flex:1; min-height:0; flex-direction:column; height:100vh; }
    @supports (height: 100dvh) { #room { height:100dvh; } }
    header { flex:none; background:var(--panel); border-bottom:1px solid var(--border); padding:12px 16px; padding-top:max(12px,env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    .room-meta { display:flex; align-items:center; gap:12px; min-width:0; } .status-dot { flex:none; width:10px; height:10px; border-radius:50%; background:var(--green); } .status-dot.offline { background:var(--red); }
    .room-code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:700; color:#a5b4fc; } .actions { display:flex; gap:8px; flex-wrap:wrap; }
    #call-stage { display:none; flex:none; background:#020617; border-bottom:1px solid var(--border); padding:12px; flex-direction:column; align-items:center; gap:12px; max-height:48%; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .video-grid { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:100%; max-width:900px; }
    .video-box { position:relative; background:var(--panel); border-radius:12px; overflow:hidden; width:100%; max-width:400px; aspect-ratio:16/9; border:1px solid var(--border); }
    video { display:block; width:100%; height:100%; object-fit:cover; background:#000; } .video-label { position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,.65); padding:4px 10px; border-radius:6px; font-size:12px; }
    .call-controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; } #incoming-banner { display:none; flex:none; background:#1e1b4b; border-bottom:1px solid var(--accent); padding:12px 16px; align-items:center; justify-content:space-between; gap:12px; }
    #messages { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:85%; padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.45; overflow-wrap:anywhere; white-space:pre-wrap; }
    .msg.me { align-self:flex-end; background:var(--accent); color:white; border-bottom-right-radius:4px; } .msg.peer { align-self:flex-start; background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .msg.sys { align-self:center; background:transparent; color:var(--muted); font-size:12px; text-align:center; } .msg-sender { font-size:11px; opacity:.75; margin-bottom:4px; font-weight:600; }
    form#chat-form { flex:none; background:var(--panel); border-top:1px solid var(--border); padding:10px 12px; padding-bottom:max(10px,env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; } #msg-input { margin-bottom:0; flex:1; }
    @media (max-width:600px) {
      .card { padding:24px; }
      header { align-items:flex-start; }
      .actions { width:100%; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
      .actions button { width:100% !important; white-space:normal; padding-left:8px; padding-right:8px; }
      #incoming-banner { align-items:flex-start; flex-direction:column; }
      #incoming-banner > div { width:100%; }
      #incoming-banner button { flex:1; }
      .video-box { max-width:none; }
      .msg { max-width:92%; }
    }
  </style>
</head>
<body>
  <div id="lobby">
    <div class="card">
      <span class="badge">100% Anonymous • No Phone Number</span>
      <h1>AnonLink</h1>
      <p class="subtitle">Instant peer-to-peer chat, voice, and video calls directly in your browser. Share your Room ID to connect.</p>
      <label for="nickname">Your Alias</label>
      <input id="nickname" type="text" placeholder="e.g. GhostRider" maxlength="20" autocomplete="nickname" />
      <button class="btn-primary" type="button" onclick="createRoom()">Create New Room</button>
      <div class="divider">OR JOIN WITH ROOM CODE</div>
      <div class="join-row">
        <input id="join-code" type="text" placeholder="ANON-XXXXXX" maxlength="11" autocapitalize="characters" autocomplete="off" />
        <button class="btn-secondary" type="button" onclick="joinRoom()">Join</button>
      </div>
    </div>
  </div>

  <div id="room">
    <header>
      <div class="room-meta">
        <div class="status-dot" id="conn-dot"></div>
        <div><div class="room-code" id="display-code">ANON-000000</div><div style="font-size:12px;color:var(--muted)" id="peer-status">Waiting for peer to join...</div></div>
      </div>
      <div class="actions">
        <button class="btn-secondary" type="button" onclick="copyInvite()">Copy Invite Link</button>
        <button class="btn-green" type="button" onclick="startCall(false)">Voice Call</button>
        <button class="btn-primary" type="button" style="width:auto" onclick="startCall(true)">Video Call</button>
        <button class="btn-red" type="button" onclick="leaveRoom()">Leave</button>
      </div>
    </header>

    <div id="incoming-banner">
      <span id="incoming-text">Incoming call...</span>
      <div style="display:flex;gap:8px">
        <button class="btn-green" type="button" onclick="acceptCall()">Accept</button>
        <button class="btn-red" type="button" onclick="rejectCall()">Decline</button>
      </div>
    </div>

    <div id="call-stage">
      <div class="video-grid">
        <div class="video-box"><video id="local-video" autoplay muted playsinline webkit-playsinline></video><div class="video-label">You</div></div>
        <div class="video-box"><video id="remote-video" autoplay playsinline webkit-playsinline></video><div class="video-label" id="remote-label">Peer</div></div>
      </div>
      <div class="call-controls">
        <button class="btn-secondary" id="mute-btn" type="button" onclick="toggleMute()">Mute Mic</button>
        <button class="btn-secondary" id="cam-btn" type="button" onclick="toggleCam()">Toggle Cam</button>
        <button class="btn-red" type="button" onclick="endCall()">End Call</button>
      </div>
    </div>

    <div id="messages" aria-live="polite"></div>
    <form id="chat-form" onsubmit="sendMessage(event)">
      <input id="msg-input" type="text" placeholder="Type a P2P message..." autocomplete="off" enterkeyhint="send" aria-label="Message" />
      <button type="submit" class="btn-primary" style="width:auto">Send</button>
    </form>
  </div>

  <script>
    let peer = null, dataConn = null, mediaCall = null, incomingCallObj = null, localStream = null;
    let myName = "Anon", roomCode = "", isHost = false;

    window.addEventListener("DOMContentLoaded", function () {
      const code = new URLSearchParams(window.location.search).get("room");
      if (code) document.getElementById("join-code").value = code.toUpperCase();
      document.getElementById("join-code").addEventListener("input", function () {
        this.value = this.value.toUpperCase();
      });
    });

    function getAlias() {
      const val = document.getElementById("nickname").value.trim();
      return val || "Anon-" + Math.floor(100 + Math.random() * 900);
    }

    function generateCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let res = "ANON-";
      for (let i = 0; i < 6; i++) res += chars[Math.floor(Math.random() * chars.length)];
      return res;
    }

    function createRoom() {
      if (typeof Peer === "undefined") return alert("AnonLink could not load its connection library. Check your internet connection and reload.");
      myName = getAlias(); roomCode = generateCode(); isHost = true; initSession();
    }

    function joinRoom() {
      const input = document.getElementById("join-code").value.trim().toUpperCase();
      if (!input) return alert("Enter a Room ID first.");
      if (!/^ANON-[A-Z0-9]{6}$/.test(input)) return alert("Room IDs should look like ANON-XXXXXX.");
      if (typeof Peer === "undefined") return alert("AnonLink could not load its connection library. Check your internet connection and reload.");
      myName = getAlias(); roomCode = input; isHost = false; initSession();
    }

    function initSession() {
      document.getElementById("lobby").style.display = "none";
      document.getElementById("room").style.display = "flex";
      document.getElementById("display-code").textContent = roomCode;
      try {
        peer = new Peer(isHost ? roomCode : undefined);
      } catch (err) {
        addSystemMsg("Could not start the connection: " + err.message);
        return;
      }
      peer.on("open", function () {
        addSystemMsg("Connected as " + myName + ". Share Room ID: " + roomCode);
        if (!isHost) setupDataConn(peer.connect(roomCode, { metadata: { name: myName }, reliable: true }));
      });
      peer.on("connection", setupDataConn);
      peer.on("call", function (call) {
        incomingCallObj = call;
        document.getElementById("incoming-text").textContent = "Incoming call from " + ((call.metadata && call.metadata.name) || "Peer") + "...";
        document.getElementById("incoming-banner").style.display = "flex";
      });
      peer.on("error", function (err) {
        addSystemMsg("Connection notice: " + (err.type || "connection error"));
        if (err.type === "unavailable-id") addSystemMsg("That room ID is already in use. Try creating another room.");
      });
      peer.on("disconnected", function () {
        document.getElementById("peer-status").textContent = "Signaling disconnected; reconnecting...";
        document.getElementById("conn-dot").classList.add("offline");
        if (peer && !peer.destroyed) peer.reconnect();
      });
    }

    function setupDataConn(conn) {
      dataConn = conn;
      conn.on("open", function () {
        document.getElementById("peer-status").textContent = "Peer connected (P2P)";
        document.getElementById("conn-dot").classList.remove("offline");
        addSystemMsg("Peer joined the room.");
        conn.send({ type: "intro", name: myName });
      });
      conn.on("data", function (data) {
        if (!data || typeof data !== "object") return;
        if (data.type === "intro") {
          document.getElementById("peer-status").textContent = "Connected with " + String(data.name || "Peer");
          document.getElementById("remote-label").textContent = String(data.name || "Peer");
        } else if (data.type === "chat" && typeof data.text === "string") {
          appendMsg(String(data.sender || "Peer"), data.text, "peer");
        }
      });
      conn.on("close", function () {
        document.getElementById("peer-status").textContent = "Peer disconnected";
        document.getElementById("conn-dot").classList.add("offline");
        addSystemMsg("Peer left the room.");
        dataConn = null;
      });
      conn.on("error", function () { addSystemMsg("The peer connection encountered an error."); });
    }

    function sendMessage(event) {
      event.preventDefault();
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text) return;
      if (!dataConn || !dataConn.open) {
        addSystemMsg("No peer is connected yet. Your message was not sent.");
        return;
      }
      appendMsg(myName, text, "me");
      dataConn.send({ type: "chat", sender: myName, text: text });
      input.value = "";
      input.focus();
    }

    function appendMsg(sender, text, cls) {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "msg " + cls;
      const name = document.createElement("div");
      name.className = "msg-sender";
      name.textContent = sender;
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(name);
      div.appendChild(body);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function addSystemMsg(text) {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "msg sys";
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function getMedia(constraints) {
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return Promise.reject(new Error("Microphone and camera require this page to be opened over HTTPS in a supported browser."));
      }
      return navigator.mediaDevices.getUserMedia(constraints);
    }

    async function startCall(withVideo) {
      if (!dataConn || !dataConn.open) return alert("Wait for a peer to join your room before starting a call.");
      if (mediaCall) return alert("A call is already active.");
      try {
        localStream = await getMedia({ audio: true, video: !!withVideo });
        showCallStage(localStream);
        const call = peer.call(dataConn.peer, localStream, { metadata: { name: myName, video: !!withVideo } });
        if (!call) throw new Error("Could not create the call.");
        bindMediaCall(call);
      } catch (err) {
        stopLocalStream();
        alert("Could not access the microphone or camera: " + err.message);
      }
    }

    async function acceptCall() {
      document.getElementById("incoming-banner").style.display = "none";
      if (!incomingCallObj) return;
      const call = incomingCallObj;
      incomingCallObj = null;
      const withVideo = !!(call.metadata && call.metadata.video);
      try {
        localStream = await getMedia({ audio: true, video: withVideo });
        showCallStage(localStream);
        call.answer(localStream);
        bindMediaCall(call);
      } catch (err) {
        call.close();
        stopLocalStream();
        alert("Could not access the microphone or camera: " + err.message);
      }
    }

    function rejectCall() {
      document.getElementById("incoming-banner").style.display = "none";
      if (incomingCallObj) incomingCallObj.close();
      incomingCallObj = null;
    }

    function bindMediaCall(call) {
      mediaCall = call;
      call.on("stream", function (remoteStream) {
        const video = document.getElementById("remote-video");
        video.srcObject = remoteStream;
        const playResult = video.play();
        if (playResult && typeof playResult.catch === "function") {
          playResult.catch(function () { addSystemMsg("Tap the remote video to start playback."); });
        }
      });
      call.on("close", function () { endCall(false); });
      call.on("error", function () { addSystemMsg("The call encountered a connection error."); endCall(false); });
    }

    function showCallStage(stream) {
      document.getElementById("call-stage").style.display = "flex";
      const video = document.getElementById("local-video");
      video.srcObject = stream;
      const playResult = video.play();
      if (playResult && typeof playResult.catch === "function") playResult.catch(function () {});
    }

    function stopLocalStream() {
      if (localStream) localStream.getTracks().forEach(function (track) { track.stop(); });
      localStream = null;
    }

    function endCall(closePeerCall) {
      const shouldClose = closePeerCall !== false;
      const call = mediaCall;
      mediaCall = null;
      if (shouldClose && call) call.close();
      stopLocalStream();
      document.getElementById("call-stage").style.display = "none";
      document.getElementById("local-video").srcObject = null;
      document.getElementById("remote-video").srcObject = null;
      document.getElementById("mute-btn").textContent = "Mute Mic";
      document.getElementById("cam-btn").textContent = "Toggle Cam";
    }

    function toggleMute() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("mute-btn").textContent = track.enabled ? "Mute Mic" : "Unmute Mic";
      }
    }

    function toggleCam() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("cam-btn").textContent = track.enabled ? "Turn Camera Off" : "Turn Camera On";
      }
    }

    async function copyInvite() {
      const url = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(roomCode);
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url);
        } else {
          const temp = document.createElement("textarea");
          temp.value = url;
          temp.style.position = "fixed";
          temp.style.opacity = "0";
          document.body.appendChild(temp);
          temp.select();
          const copied = document.execCommand("copy");
          document.body.removeChild(temp);
          if (!copied) throw new Error("Clipboard access was denied.");
        }
        addSystemMsg("Invite link copied to clipboard.");
      } catch (err) {
        prompt("Copy this invite link:", url);
      }
    }

    function leaveRoom() {
      endCall();
      if (incomingCallObj) incomingCallObj.close();
      if (dataConn) dataConn.close();
      if (peer) peer.destroy();
      window.location.href = window.location.pathname;
    }
  </script>
</body>
</html>
